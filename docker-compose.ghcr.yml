services:
  api:
    image: ${API_IMAGE:-ghcr.io/ospoon/wechat-ilink-api}:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 13333
      APP_URL: http://localhost:13333
      DB_DATABASE: /app/data/db.sqlite3
      MEDIA_STORAGE_PATH: /app/data/media
      DEFAULT_TEST_ACCOUNT_ENABLED: 'false'
    ports:
      - '13333:13333'
    volumes:
      - ./data:/app/data
      - ./data/media:/app/data/media
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:13333/health/live')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/ospoon/wechat-ilink-api-admin}:${IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '18080:80'
    restart: unless-stopped
